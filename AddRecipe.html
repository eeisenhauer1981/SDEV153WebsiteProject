<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>In My Kitchen</title>
  </head>
  <body>
    <div class="anchor">
      <header>
        <div class = "header-title">
          <h1>In My Kitchen</h1>
          <!--button to open navigation menu-->
          <button class="pages-nav-button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="pages-navigation">
            <img src="images/menu.svg" alt="">
          </button>
        </div>
        <nav class="pages-nav" id="pages-navigation">
          <ul>
            <li><a href="CurrentMenu.html">View Current Menu</a></li>
            <li><a href="CreateMenu.html">Create New Menu</a></li>
            <li><a href="AllRecipes.html">View All Recipes</a></li>
            <li>Add New Recipe</li>
            <li><a href="index.html">Home</a></li>
          </ul>
        </nav>
      </header>
      <main>
        <h1>Add a New Recipe</h1>
        <form class="add-recipe">
          <ul class="add-recipe-inputs">
            <li>
              <label for="recipename">Recipe Name*</label>
              <input type="text" id="recipename" name="recipename" required>
            </li>
            <li>
              <label for="recipelink">Recipe Link*</label>
              <input type="url" id="recipelink" name="recipelink" required>
            </li>
            <li>
              <label for="recipetype">Recipe Type*</label>
              <select name="recipetype" id="recipetype" required>
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
              </select>
            </li>
            <li>
              <label for="recipeimagelink">Image Link</label>
              <input type="url" id="recipeimagelink" name="recipeimagelink">
            </li>
          </ul>
          <div class="submit-container">
            <input type="submit" value="Add Recipe">
          </div>
        </form>
      </main>
      <footer>
        <h4>Site by Emily Eisenhauer | 2026</h4>
      </footer>
    </div>
  </body>
  <!-- script.js runs on every page to load recipes and menu lists-->
  <script src="script.js"></script>
  <!-- AddRecipe.js has fuctionality to add a new recipe to localStorage-->
  <script src="AddRecipe.js"></script>
  </html>
