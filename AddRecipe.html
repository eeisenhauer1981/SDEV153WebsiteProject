    <div class = "anchor">
      <h1>Add a New Recipe</h1>
      <form class="add-recipe">
        <label for="recipename">Recipe Name*</label><br>
        <input type="text" id="recipename" name="recipename" required><br>
        <label for="recipelink">Recipe Link*</label><br>
        <input type="url" id="recipelink" name="recipelink" required>
        <label for="recipetype">Recipe Type*</label><br>
        <select name="recipetype" id="recipetype" required>
          <option value="breakfast">Breakfast</option>
          <option value="lunch">Lunch</option>
          <option value="dinner">Dinner</option>
        </select><br>
        <label for="recipeimagelink">Image Link</label><br>
        <input type="url" id="recipeimagelink" name="recipeimagelink">

        <label for="ingredients">Ingredients</label><br>

        <textarea type="text" id="directions" name="directions"></textarea><br>
        -->
