<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>In My Kitchen</title>
  </head>
  <body>
    <div class="anchor">
      <header>
        <div class = "header-title">
          <h1>In My Kitchen</h1>
          <!--button to display nav menu-->
          <button class="pages-nav-button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="pages-navigation">
            <img src="images/menu.svg" alt="">
          </button>
        </div>
        <nav class="pages-nav">
          <ul>
            <li>View Current Menu</li>
            <li><a href="CreateMenu.html">Create New Menu</a></li>
            <li><a href="AllRecipes.html">View All Recipes</a></li>
            <li><a href="AddRecipe.html">Add New Recipe</a></li>
            <li><a href="index.html">Home</a></li>
          </ul>
        </nav>
      </header>
      <main>
        <h1>Current Menu</h1>
        <div class = "recipe-list-container">
          <button class="breakfast-recipe-reveal">
            <h2>Breakfast</h2>
          </button>
          <ul class="breakfast" id="breakfast-reveal">
          <!--CurrentMenu.js adds <li>-->
          </ul>
          <button class="lunch-recipe-reveal">
            <h2>Lunch</h2>
          </button>
          <ul class="lunch" id="lunch-reveal">
          <!--CurrentMenu.js adds <li>-->
          </ul>
          <button class="dinner-recipe-reveal">
            <h2>Dinner</h2>
          </button>
          <ul class="dinner" id="dinner-reveal">
          <!--CurrentMenu.js adds <li>-->
          </ul>
        </div>
      </main>
      <footer>
        <h4>Site by Emily Eisenhauer | 2026</h4>
      </footer>
    </div>
  </body>
  <!--script.js runs on every page to load recipe and menu lists-->
  <script src="script.js"></script>
  <!--CurrentMenu.js loads recipes from saved current menu to display on the page-->
  <script src="CurrentMenu.js"></script>
</html>
