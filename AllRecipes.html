<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Displays all recipes in a user's collection by meal category">
    <link href="style.css" rel="stylesheet">
    <title>In My Kitchen View All Recipes</title>
  </head>
  <body>
    <div class="anchor">
      <header>
        <div class = "header-title">
          <h1><a href="index.html"> In My Kitchen</a></h1>
          <!--button to launch nav menu-->
          <button class="pages-nav-button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="pages-navigation">
            <img src="images/menu.svg" alt="Hamburger menu icon for page navigation">
          </button>
        </div>
        <nav class="pages-nav">
          <ul>
            <li><a href="CurrentMenu.html">View Current Menu</a></li>
            <li><a href="CreateMenu.html">Create New Menu</a></li>
            <li>View All Recipes</li>
            <li><a href="AddRecipe.html">Add New Recipe</a></li>
            <li><a href="index.html">Home</a></li>
          </ul>
        </nav>
      </header>
      <main>
        <h1>Recipe Collection</h1>
        <div class = "recipe-list-container">
          <form class="recipe-search">
            <label for="search-recipe">Search Your Collection:</label>
            <input type="text" id="search-recipe" name="search-recipe" placeholder="Recipe Name" required>
            <input type="submit" value="Search">
          </form>
          <button class="breakfast-recipe-reveal">
            <h2>Breakfast</h2>
          </button>
          <ul class="breakfast" id="breakfast-reveal">
          <!--AllRecipes.js adds <li>-->
          </ul>
          <button class="lunch-recipe-reveal">
            <h2>Lunch</h2>
          </button>
          <ul class="lunch" id="lunch-reveal">
          <!--AllRecipes.js adds <li>-->
          </ul>
          <button class="dinner-recipe-reveal">
            <h2>Dinner</h2>
          </button>
          <ul class="dinner" id="dinner-reveal">
          <!--AllRecipes.js adds <li>-->
          </ul>
        </div>
      </main>
      <footer>
        <h4>Site by Emily Eisenhauer | 2026</h4>
      </footer>
    </div>
  </body>
  <!--script.js runs on every page to load current recipes and menu lists-->
  <script src="script.js"></script>
  <!--AllRecipes.js dynamically adds li items to display recipes on AllRecipes page-->
  <script src="AllRecipes.js"></script>
</html>
